<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Innovatech Chile | Panel de Gestión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Importación de tipografía moderna -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #64748b;
      --secondary-hover: #475569;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #e2e8f0;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    header p {
      margin: 0;
      font-size: 1rem;
      color: #bfdbfe;
      font-weight: 400;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    section {
      background: var(--bg-card);
      padding: 32px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:attr(id="btnCargar"), button:not(.secondary):not(.danger) {
      background-color: var(--primary);
      color: white;
    }

    button:attr(id="btnCargar"):hover, button:not(.secondary):not(.danger):hover {
      background-color: var(--primary-hover);
    }

    button.secondary {
      background-color: #f1f5f9;
      color: var(--secondary-hover);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background-color: #e2e8f0;
    }

    button.danger {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
    }

    button.danger:hover {
      background-color: var(--danger);
      color: white;
    }

    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th {
      background-color: #f8fafc;
      color: var(--text-muted);
      font-weight: 600;
      padding: 14px 16px;
      border-bottom: 2px solid var(--border);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .form-group-full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, textarea {
      font-family: inherit;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      box-sizing: border-box;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      resize: vertical;
    }

    .status {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px;
      border-radius: var(--radius-sm);
      display: none;
    }

    .status.ok {
      display: block;
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .status.error {
      display: block;
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fec2c2;
    }
  </style>
</head>
<body>

  <header>
    <h1>Innovatech Chile</h1>
    <p>Panel de Gestión de Dispositivos Tecnológicos para Mascotas</p>
  </header>

  <main>
    <!-- Sección de Tabla -->
    <section>
      <h2>Inventario de Dispositivos</h2>
      <div class="actions">
        <button id="btnCargar">Sincronizar Inventario</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Dispositivo</th>
              <th>Especificaciones Técnicas</th>
              <th>Precio (CLP)</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyProductos">
            <!-- Filas insertadas dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Sección de Formulario -->
    <section>
      <h2 id="formTitle">Registrar Nuevo Dispositivo</h2>
      <div class="form-grid">
        <div>
          <label for="nombre">Nombre de la Maquina</label>
          <input type="text" id="nombre" placeholder="Ej: Comedero Inteligente Pro" />
        </div>
        <div>
          <label for="precio">Precio de Venta</label>
          <input type="number" id="precio" step="0.01" min="0" placeholder="Ej: 19990" />
        </div>
        <div>
          <label for="stock">Unidades Disponibles</label>
          <input type="number" id="stock" min="0" placeholder="Ej: 15" />
        </div>
        <div class="form-group-full">
          <label for="descripcion">Descripción y Funcionalidades</label>
          <textarea id="descripcion" rows="3" placeholder="Ej: Conexión Wi-Fi, dosificador automático con cámara HD para cachorros..."></textarea>
        </div>
      </div>
      
      <div class="actions" style="margin-top: 24px; margin-bottom: 0;">
        <button id="btnGuardar">Guardar Dispositivo</button>
        <button id="btnCancelar" class="secondary">Cancelar</button>
      </div>
      
      <div id="status" class="status"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
